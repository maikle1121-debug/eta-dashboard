# sync_subscribers.json — تجديد حائط الصد تلقائياً
# (بديل أول لـ Edge Function — بلا أي CLI، بلا أسرار مكتوبة)
# المكان: /eta-dashboard/.github/workflows/sync-subscribers.yml.github/workflows/sync-subscribers.ymlر
# يشتغل كل 5 دقائق + زر "تشغيل يدوي" من تبويب Actions.
name: Sync Subscribers JSON

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build subscribers.json from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DATA=$(curl -sS -f -X POST "$SUPABASE_URL/rest/v1/rpc/get_subscribers_compact" \
            -H "Content-Type: application/json" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -d '{}') || { echo "RPC get_subscribers_compact failed"; exit 1; }
          export DATA
          node -e '
            const fs = require("fs");
            const rows = JSON.parse(process.env.DATA);
            const subs = {};
            for (const r of rows) subs[r.email] = r.status;
            const right = { v: 1, updated: new Date().toISOString(), count: rows.length, subs };
            const next = JSON.stringify(right, null, 2) + "\n";
            const prev = fs.existsSync("subscribers.json") ? fs.readFileSync("subscribers.json", "utf8") : "";
            if (prev.trim() !== next.trim()) fs.writeFileSync("subscribers.json", next);
          '

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add subscribers.json
            git commit -m "chore: sync subscribers.json"
            git push
          fi
