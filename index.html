<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم ETA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-gate" class="hidden">
    <div class="login-card">
      <h2>لوحة تحكم ETA</h2>
      <p>أدخل مفتاح الإدارة للمتابعة</p>
      <input id="login-key" type="password" placeholder="Admin API Key" autocomplete="off">
      <button id="login-btn" class="btn primary block">دخول</button>
      <div id="login-msg" class="error"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">ETA <span>لوحة التحكم</span></div>
      <nav>
        <a href="#/stats" data-nav="stats">الإحصائيات</a>
        <a href="#/devices" data-nav="devices">جميع الأجهزة</a>
        <a href="#/today" data-nav="today">المسجلون اليوم</a>
        <a href="#/add" data-nav="add">إضافة مشترك</a>
        <a href="#/settings" data-nav="settings">الإعدادات العامة</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn">تسجيل الخروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title"></h1>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="pages.js"></script>
</body>
</html>
